    <link rel="stylesheet" href="style/style.css">
</head>

<body>

    <!-- Header pour le logo, le nom du magasin et les onglets -->
    <header>

        <!-- div pour le logo et le nom du magasin -->
        <div>
            <h1>Otaku Shop</h1>
            <img src="img/Logo_shop2.png" alt="Logo_shop2.png">
        </div>

        <!-- div pour les onglets -->
        <div>
            <nav>
                <a href="url">Mangas</a>
                <a href="url">Jeux Vidéos</a>
                <a href="url">Films et Series asiatiques</a>
            </nav>
        </div>
    </header>

    <!-- Main pour le contenu principal de la page -->
    <main>

        <!-- div pour chaque article -->
        <div>
            <p>Catégorie</p>
            <img src="img/FairyTail-Volume_1_Cover.jpg" alt="FairyTail-Volume_1_Cover.png">
            <p>Hiro Mashima - FairyTail - Tome 1</p>

            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>

            <span>(18)</span>
            <a href="url">Ajouter au panier</a>
            <p>3€</p>
        </div>
        <div>
            <p>Catégorie</p>
            <img src="img/Edens_Zero_Volume_1_Cover.jpg" alt="Edens_Zero_Volume_1_Cover.jpg">
            <p>Hiro Mashima - Edens Zero - Tome 1</p>

            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>

            <span>(18)</span>
            <a href="url">Ajouter au panier</a>
            <p>3€</p>
        </div>
